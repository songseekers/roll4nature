name: Update Live Tracking Link

on:
  workflow_dispatch:
    inputs:
      glympse_url:
        description: 'Glympse URL (e.g. https://glympse.com/!abc123)'
        required: true
        type: string

jobs:
  update-tracking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write tracking.json
        run: |
          EXPIRES=$(( $(date +%s) + 36000 ))
          echo "{\"url\": \"${{ github.event.inputs.glympse_url }}\", \"expires\": $EXPIRES}" > src/data/tracking.json
          echo "Written tracking.json with expiry at $EXPIRES ($(date -d @$EXPIRES))"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tracking.json
          git commit -m "ride: update live tracking link"
          git push
