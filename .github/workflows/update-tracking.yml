name: Update Live Tracking Link

on:
  workflow_dispatch:
    inputs:
      glympse_url:
        description: 'Glympse URL (e.g. https://glympse.com/!abc123)'
        required: true
        type: string
      hours:
        description: 'Hours to keep link active (e.g. 6, 8, 10)'
        required: true
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  update-tracking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write tracking.json
        run: |
          SECONDS_ACTIVE=$(( ${{ github.event.inputs.hours }} * 3600 ))
          EXPIRES=$(( $(date +%s) + $SECONDS_ACTIVE ))
          echo "{\"url\": \"${{ github.event.inputs.glympse_url }}\", \"expires\": $EXPIRES}" > src/data/tracking.json
          echo "Written tracking.json — active for ${{ github.event.inputs.hours }} hours, expires at $EXPIRES ($(date -d @$EXPIRES))"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tracking.json
          git commit -m "ride: update live tracking link (${{ github.event.inputs.hours }}h)"
          git push
